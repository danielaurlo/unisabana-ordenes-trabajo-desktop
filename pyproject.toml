[project]
name = "gestor-contratos-desktop"
version = "0.1.0"
description = "Aplicación de escritorio local para generar actas de entrega"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.12.0",
    "pymupdf>=1.26,<1.27",
    "pyside6>=6.9.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.4.0",
    "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestor_contratos"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".venv", "runtime", "deployment"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
